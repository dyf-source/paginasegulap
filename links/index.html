<link rel="preload" href="../assets/fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>

<style>
:root {
  --red: #CC1010;
  --red-dark: #A00C0C;
  --red-hot: #ff3b1f;
  --ink: #0b0b0b;
  --ink-2: #161616;
  --white: #ffffff;
  --muted: rgba(255,255,255,0.55);
  --line: rgba(255,255,255,0.12);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--ink);
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Atmosphere: photo + fire glow + grain */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.bg-photo {
  position: absolute;
  inset: 0;
  background: url('../assets/images/extintores-wide.webp') center 30% / cover no-repeat;
  opacity: .22;
  filter: grayscale(.4) contrast(1.1);
  transform: scale(1.08);
  animation: drift 24s ease-in-out infinite alternate;
}
.bg-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 60% at 50% 115%, rgba(204,16,16,.85) 0%, rgba(204,16,16,.25) 40%, transparent 70%),
    radial-gradient(60% 40% at 85% 0%, rgba(255,59,31,.18) 0%, transparent 70%),
    linear-gradient(to bottom, rgba(11,11,11,.55) 0%, rgba(11,11,11,.92) 55%, rgba(11,11,11,.7) 100%);
}
.bg-grain {
  position: absolute;
  inset: -50%;
  opacity: .09;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.bg-slash {
  position: absolute;
  left: -20%;
  right: -20%;
  top: 34%;
  height: 140px;
  background: linear-gradient(90deg, transparent, rgba(204,16,16,.16), transparent);
  transform: rotate(-8deg);
}

@keyframes drift {
  from { transform: scale(1.08) translate3d(0,0,0); }
  to   { transform: scale(1.14) translate3d(-2%, -1.5%, 0); }
}

.wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: calc(48px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* Header */
.head {
  margin-bottom: 36px;
}
.logo {
  display: block;
  width: 190px;
  max-width: 60%;
  margin-bottom: 28px;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,.6));
}
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--red-hot);
  margin-bottom: 10px;
}
.kicker::before {
  content: '';
  width: 28px;
  height: 2px;
  background: currentColor;
}
.head h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: clamp(40px, 12vw, 56px);
  line-height: .92;
  text-transform: uppercase;
  margin: 0;
  letter-spacing: -.01em;
}
.head h1 span {
  display: block;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--white);
}

/* Links */
.links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.link {
  position: relative;
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: 16px;
  min-height: 76px;
  padding: 12px 20px 12px 12px;
  text-decoration: none;
  color: var(--white);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  background: linear-gradient(100deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border: 1px solid var(--line);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  /* Angled cut on the trailing corner */
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  overflow: hidden;
  isolation: isolate;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, background .35s;
}

/* Red fill that sweeps in from the left when engaged */
.link::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(100deg, var(--red) 0%, var(--red-dark) 100%);
  transform: translateX(-101%);
  transition: transform .45s cubic-bezier(.7,0,.2,1);
}

/* Engaged state. :hover is gated to real pointers so touch devices don't keep
   a "stuck" highlight after a tap or when returning via the back button. */
.link:focus-visible,
.link:active {
  border-color: transparent;
  outline: none;
}
.link:focus-visible::before,
.link:active::before {
  transform: translateX(0);
}
.link:active::before {
  transition-duration: .2s;
}
.link:active {
  transform: scale(.98);
  transition-duration: .1s;
}
@media (hover: hover) and (pointer: fine) {
  .link:hover {
    border-color: transparent;
    transform: translateX(6px);
  }
  .link:hover::before {
    transform: translateX(0);
  }
  .link:hover:active {
    transform: translateX(6px) scale(.985);
  }
}

.link-icon {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  background: var(--red);
  clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%);
  transition: background .35s;
}
.link:focus-visible .link-icon,
.link:active .link-icon {
  background: rgba(0,0,0,.28);
}
@media (hover: hover) and (pointer: fine) {
  .link:hover .link-icon { background: rgba(0,0,0,.28); }
}
.link-icon svg,
.link-icon img {
  width: 24px;
  height: 24px;
}

.link-text {
  min-width: 0;
}
.link-title {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 22px;
  line-height: 1.05;
  text-transform: uppercase;
  letter-spacing: .02em;
}
.link-sub {
  display: block;
  margin-top: 3px;
  font-size: 13.5px;
  line-height: 1.3;
  color: var(--muted);
  transition: color .35s;
}
.link:focus-visible .link-sub,
.link:active .link-sub {
  color: rgba(255,255,255,.85);
}

.link-arrow {
  width: 20px;
  height: 20px;
  opacity: .45;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
}
.link:focus-visible .link-arrow,
.link:active .link-arrow {
  opacity: 1;
  transform: translate(3px, -3px);
}
@media (hover: hover) and (pointer: fine) {
  .link:hover .link-sub { color: rgba(255,255,255,.85); }
  .link:hover .link-arrow { opacity: 1; transform: translate(3px, -3px); }
}

/* Footer */
.foot {
  margin-top: auto;
  padding-top: 40px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .04em;
}
.foot strong {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--white);
  margin-bottom: 2px;
}
.foot-social {
  display: flex;
  gap: 10px;
}
.foot-social a {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  color: var(--white);
  transition: background .3s, border-color .3s;
}
.foot-social a {
  -webkit-tap-highlight-color: transparent;
}
.foot-social a:focus-visible,
.foot-social a:active {
  background: var(--red);
  border-color: var(--red);
  outline: none;
}
@media (hover: hover) and (pointer: fine) {
  .foot-social a:hover { background: var(--red); border-color: var(--red); }
}

/* Page load: staggered rise */
.reveal {
  opacity: 0;
  transform: translateY(18px);
  animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: calc(var(--i, 0) * 80ms + 120ms);
}
@keyframes rise {
  to { opacity: 1; transform: none; }
}

/* Small phones: tighter header so all four links sit above the fold */
@media (max-width: 380px), (max-height: 700px) {
  .wrap { padding-top: calc(28px + env(safe-area-inset-top)); }
  .head { margin-bottom: 24px; }
  .logo { width: 150px; margin-bottom: 18px; }
  .head h1 { font-size: clamp(34px, 11vw, 44px); }
  .links { gap: 10px; }
  .link { min-height: 68px; gap: 14px; padding-right: 16px; }
  .link-title { font-size: 20px; }
  .link-sub { font-size: 13px; }
}

@media (min-width: 720px) {
  .wrap { padding-top: 80px; }
  .head h1 { font-size: 64px; }
}

@media (prefers-reduced-motion: reduce) {
  .bg-photo { animation: none; }
  .reveal { animation: none; opacity: 1; transform: none; }
  .link, .link::before, .link-arrow { transition: none; }
}
</style>
</head>
